# End-to-end proxy test: replay the synthetic capture through the proxy into a sink.
# The proxy writes its own capture so the fixture is never overwritten.

[general]
experiment = "exp_001"
output_dir = "exp_results"

[dissect]
input = "exp_results/capture.bin"
output = "exp_results/dissection.json"

[proxy]
listen = "127.0.0.1:18080"
target = "127.0.0.1:18081"
capture = "exp_results/proxy-capture.bin"
capture_down = "exp_results/proxy-capture-down.bin"
delay_ms = 0
drop_percent = 0
bandwidth_bytes_per_sec = 0
chunk_bytes = 65536
