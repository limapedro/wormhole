# Reference sender -> proxy -> reference receiver test.

[general]
experiment = "exp_002"
output_dir = "exp_results"

[dissect]
input = "exp_results/proxy-capture.bin"
output = "exp_results/reference-dissection.json"

[proxy]
listen = "127.0.0.1:18080"
target = "127.0.0.1:18081"
capture = "exp_results/proxy-capture.bin"

[reference]
target = "127.0.0.1:18080"
listen = "127.0.0.1:18081"
frames = 10
fps = 30
quality = 90
output = "exp_results/reference-receiver.csv"
