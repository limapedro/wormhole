# 40 Mbit/s link simulation for the gaming PC -> streaming PC workflow.
# 40,000,000 bits/s = 5,000,000 bytes/s.

[general]
experiment = "exp_011"
output_dir = "exp_results"

[dissect]
input = "exp_results/obs-workflow-capture.bin"
output = "exp_results/obs-workflow-dissection.json"

[proxy]
listen = "127.0.0.1:18080"
target = "127.0.0.1:18081"
capture = "exp_results/obs-workflow-upstream.bin"
capture_down = "exp_results/obs-workflow-capture.bin"
delay_ms = 0
drop_percent = 0
bandwidth_bytes_per_sec = 5000000
chunk_bytes = 65536

[media]
quality_output = "exp_results/obs-workflow-quality.json"
