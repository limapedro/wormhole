[package]
name = "wormhole-harness"
description = "Reverse-engineering, differential testing and benchmark harness for Wormhole"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wh-protocol = { path = "../crates/protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jpeg-encoder = "0.7"
jpeg-decoder = "0.3"
